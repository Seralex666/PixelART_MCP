[package]
name = "pixel-editor"
description = "Desktop editor for PixelART MCP."
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "pixelart-studio"
path = "src/main.rs"

[dependencies]
pixel-core = { path = "../pixel-core" }
pixel-mcp = { path = "../pixel-mcp" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
uuid.workspace = true
image.workspace = true
serde_json.workspace = true
rfd = "0.18.0"
dirs.workspace = true

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true
