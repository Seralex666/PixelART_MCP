name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Tests und exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p pixel-editor
      # Die fertige exe hat kein Konsolenfenster. Hier wird geprüft, dass sie
      # trotzdem als MCP-Server über stdin/stdout spricht.
      - run: cargo test --release -p pixel-editor --test mcp_mode
      - uses: actions/upload-artifact@v4
        with:
          name: pixelart-studio-windows
          path: target/release/pixelart-studio.exe
          if-no-files-found: error
