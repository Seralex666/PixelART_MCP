name: Release

# Baut die Windows-Programme (Editor und MCP-Server) und legt sie als Release ab. Zwei Wege:
# - einen Tag wie v0.1.0 pushen, oder
# - den Workflow von Hand starten (Actions → Release → Run workflow) und die
#   Version angeben; der Tag wird dann beim Anlegen des Release erzeugt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version des Release, z. B. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows-Programme bauen und veröffentlichen
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Version prüfen
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$TAG' muss die Form v1.2.3 haben"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p pixel-mcp -p pixel-editor
      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            target/release/pixelart-studio.exe \
            target/release/pixelart-mcp.exe \
            --target "$GITHUB_SHA" \
            --title "PixelArt Studio $TAG" \
            --notes "Windows-Programme: pixelart-studio.exe (Editor) und pixelart-mcp.exe (MCP-Server für Claude). Beide in denselben Ordner legen. Die Einrichtung steht im Editor unter Hilfe → Mit Claude verbinden und in docs/MCP-EINRICHTUNG.md."
